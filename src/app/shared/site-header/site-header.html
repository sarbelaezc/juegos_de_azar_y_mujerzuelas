<header class="flex min-h-[72px] items-center justify-between gap-3 border-b border-line sm:min-h-[88px]">
  <a
    class="inline-flex shrink-0 items-center gap-2 rounded font-bold tracking-tight text-ink no-underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent-dark sm:gap-3"
    routerLink="/"
    aria-label="JA&M, inicio"
  >
    <span class="grid rotate-[-8deg] grid-cols-2 gap-[3px]" aria-hidden="true">
      <span class="size-[7px] rounded-sm bg-accent"></span>
      <span class="size-[7px] rounded-sm bg-highlight"></span>
      <span class="size-[7px] rounded-sm bg-highlight"></span>
      <span class="size-[7px] rounded-sm bg-accent"></span>
    </span>
    <span>JA&amp;M</span>
  </a>

  @if (backLink(); as link) {
    <a
      class="rounded text-right text-xs font-semibold text-accent-dark underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent-dark sm:text-base"
      [routerLink]="link"
    >
      <span aria-hidden="true">←</span> Todos los juegos
    </a>
  }
</header>
